<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Vibrant Accents -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <radialGradient id="glowOrb1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowOrb2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      @keyframes floatNode1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatNode2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes floatNode3 {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(6px); }
      }
      .anim-dash {
        stroke-dasharray: 6 6;
        animation: dashFlow 3s linear infinite;
      }
      .anim-node1 { animation: floatNode1 5s ease-in-out infinite; }
      .anim-node2 { animation: floatNode2 6s ease-in-out infinite; }
      .anim-node3 { animation: floatNode3 7s ease-in-out infinite; }
      .anim-pulse { animation: pulseGlow 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="240" cy="120" r="280" fill="url(#glowOrb1)" />
  <circle cx="960" cy="300" r="300" fill="url(#glowOrb2)" />

  <!-- Subtle Cyber Graph Matrix (Background Layer) -->
  <g opacity="0.18">
    <line x1="100" y1="50" x2="1100" y2="50" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="100" y1="150" x2="1100" y2="150" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="100" y1="250" x2="1100" y2="250" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="100" y1="350" x2="1100" y2="350" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />
  </g>

  <!-- Dynamic Knowledge Graph Interconnect Lines (Behind Foreground Text) -->
  <g opacity="0.6">
    <path d="M 120 180 Q 220 100 350 140 T 580 110" fill="none" stroke="#38bdf8" stroke-width="2" class="anim-dash" />
    <path d="M 640 110 Q 820 80 980 150 T 1100 240" fill="none" stroke="#818cf8" stroke-width="2" class="anim-dash" />
    <path d="M 160 320 Q 340 370 520 310 T 880 340" fill="none" stroke="#c084fc" stroke-width="2" class="anim-dash" />
    <line x1="350" y1="140" x2="520" y2="310" stroke="#334155" stroke-width="1.5" />
    <line x1="980" y1="150" x2="880" y2="340" stroke="#334155" stroke-width="1.5" />
    <line x1="120" y1="180" x2="160" y2="320" stroke="#334155" stroke-width="1.5" />
  </g>

  <!-- Animated Dynamic Ambient Graph Nodes (Subtle Edge Placements) -->
  <g class="anim-node1">
    <circle cx="120" cy="180" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" filter="url(#glowFilter)" />
    <circle cx="120" cy="180" r="7" fill="#38bdf8" />
    <text x="120" y="215" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">LPG / Cypher</text>
  </g>

  <g class="anim-node2">
    <circle cx="160" cy="320" r="16" fill="#1e293b" stroke="#c084fc" stroke-width="2.5" filter="url(#glowFilter)" />
    <circle cx="160" cy="320" r="6" fill="#c084fc" />
    <text x="160" y="352" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">RDF / OWL</text>
  </g>

  <g class="anim-node3">
    <circle cx="1060" cy="160" r="18" fill="#1e293b" stroke="#34d399" stroke-width="2.5" filter="url(#glowFilter)" />
    <circle cx="1060" cy="160" r="7" fill="#34d399" />
    <text x="1060" y="195" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">GraphRAG</text>
  </g>

  <g class="anim-node1">
    <circle cx="1040" cy="310" r="16" fill="#1e293b" stroke="#f43f5e" stroke-width="2.5" filter="url(#glowFilter)" />
    <circle cx="1040" cy="310" r="6" fill="#f43f5e" />
    <text x="1040" y="342" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Ontology LLM</text>
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed Clear, Centered & Highly Legible -->
  <g id="foreground-content" filter="url(#shadowFilter)">
    <!-- Category Badge Pill -->
    <g transform="translate(600, 75)">
      <rect x="-175" y="-18" width="350" height="36" rx="18" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
      <circle cx="-145" cy="0" r="5" fill="#38bdf8" class="anim-pulse" />
      <text x="5" y="5" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">ENTERPRISE KNOWLEDGE ARCHITECTURE</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="152" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="44" font-weight="800" text-anchor="middle" letter-spacing="-0.5">
      Enterprise Knowledge Graphs
    </text>

    <!-- Subtitle Gradient Accent -->
    <text x="600" y="202" fill="url(#neonCyan)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="34" font-weight="800" text-anchor="middle" letter-spacing="-0.2">
      &amp; Automated Ontologies
    </text>

    <!-- Descriptive Tagline -->
    <text x="600" y="246" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" text-anchor="middle">
      Curated Landscape of Graph Databases, GraphRAG Engines, Neuro-Symbolic AI &amp; LLM Ontology Induction
    </text>

    <!-- Feature Attribute Badges (Bottom Center) -->
    <g transform="translate(600, 310)">
      <!-- Pill 1: GraphRAG -->
      <g transform="translate(-270, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
        <text x="0" y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ GraphRAG Memory</text>
      </g>

      <!-- Pill 2: Auto Ontologies -->
      <g transform="translate(-85, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#0f172a" stroke="#c084fc" stroke-width="1" />
        <text x="0" y="5" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🧠 Auto-Ontology</text>
      </g>

      <!-- Pill 3: LPG & RDF Stores -->
      <g transform="translate(100, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#0f172a" stroke="#34d399" stroke-width="1" />
        <text x="0" y="5" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🕸️ LPG &amp; W3C Triples</text>
      </g>

      <!-- Pill 4: Production Scale -->
      <g transform="translate(280, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
        <text x="0" y="5" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🏢 Enterprise Scale</text>
      </g>
    </g>
  </g>
</svg>